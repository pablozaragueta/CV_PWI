<!DOCTYPE html>
<html>

	<head>
		<meta charset="UTF-8">
		<title> LogIn </title>
		<link rel="stylesheet" href="styleLogin.css">
	</head>

    <body>
        <div class="flexContainer" id="login">
            <br>
            <h2>LOGIN</h2>
            <form id="loginForm">
                <div class="login" id="NomUsuari">
                    <label for="Nom">Nom d'usuari: </label><br>
                    <input type="text" name="NomUsuari"><br><br>
                </div>
                <div class="login" id="Password">
                    <label for="Contrassenya">Contrassenya: </label><br>
                    <input type="password" name="Contrassenya"><br><br>
                </div>
                <div class="login" id="Enviar">
                    <input type="submit" value="Enviar"><br>
                </div>
            </form>
        </div>
        <script src="login.js"></script>
    </body>
</html>
